<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAULT / 私人加密文件庫</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0d12; --bg2:#10151d; --panel:#141a23; --panel2:#1a2230;
  --line:#273244; --line2:#35445b; --text:#f3f6fb; --muted:#98a6ba;
  --accent:#8cb4ff; --accent2:#b7ccff; --good:#80dfad; --warn:#f0c56d; --bad:#ff8798;
  --shadow:0 24px 80px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:linear-gradient(180deg,#0d1118 0%,#0a0d12 100%);padding:24px 18px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 4px}
.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#9fc0ff,#628fe9);display:grid;place-items:center;box-shadow:0 10px 35px rgba(105,151,242,.25)}
.brandmark svg{width:22px;height:22px;fill:#07101f}
.brand h1{font-size:17px;margin:0;letter-spacing:.02em}.brand small{display:block;color:var(--muted);margin-top:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:grid;gap:7px}.nav button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid transparent;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left}.nav button:hover{background:#131a24;color:var(--text)}.nav button.active{background:#182130;border-color:#27364b;color:var(--text)}
.nav .left{display:flex;gap:10px;align-items:center}.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}.count{font-size:12px;color:#77869b}
.side-label{font-size:11px;color:#66758b;letter-spacing:.12em;text-transform:uppercase;padding:0 12px;margin:3px 0 7px}.folders{display:grid;gap:5px;max-height:31vh;overflow:auto}.folderbtn{width:100%;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folderbtn:hover,.folderbtn.active{background:#151d28;color:var(--text)}
.sidebar-bottom{margin-top:auto}.storage{padding:13px;border:1px solid var(--line);border-radius:12px;background:#101620}.storage .top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.bar{height:5px;background:#202a38;border-radius:99px;overflow:hidden;margin-top:9px}.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.main{min-width:0;padding:28px 34px 50px}.topbar{display:flex;align-items:center;gap:14px;justify-content:space-between}.headline h2{font-size:26px;margin:0}.headline p{color:var(--muted);margin:7px 0 0;font-size:14px}.top-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#151c26;color:var(--text);border-radius:11px;padding:10px 13px;display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:var(--line2);background:#1a2330}.btn.primary{background:var(--accent);border-color:transparent;color:#07101f;font-weight:800}.btn.primary:hover{background:var(--accent2)}.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:10px;margin:26px 0 18px}.search{position:relative}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#718198;fill:none;stroke-width:2}.search input,.toolbar select{width:100%;background:#111720;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 13px;outline:none}.search input{padding-left:40px}.search input:focus,.toolbar select:focus{border-color:#5377ad}.toolbar select{width:auto;min-width:138px}
.drop{border:1px dashed #33445c;border-radius:16px;padding:17px 18px;background:linear-gradient(180deg,rgba(105,151,242,.045),rgba(105,151,242,.015));display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;transition:.18s}.drop.drag{border-color:var(--accent);background:rgba(105,151,242,.11);transform:translateY(-1px)}.drop strong{font-size:14px}.drop span{color:var(--muted);font-size:13px;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.card{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,#151c26,#111720);border-radius:15px;padding:17px;min-height:187px;display:flex;flex-direction:column;transition:.15s;overflow:hidden}.card:hover{transform:translateY(-2px);border-color:#3a4a62;box-shadow:0 13px 35px rgba(0,0,0,.19)}.card.archived{opacity:.78}.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#739fff,#adbeff);opacity:.72}.cardhead{display:flex;justify-content:space-between;gap:10px}.fileicon{width:40px;height:40px;border-radius:11px;background:#1e2b3d;border:1px solid #2b3d55;display:grid;place-items:center;flex:none}.fileicon svg{width:20px;height:20px;stroke:#9bbcff;fill:none;stroke-width:1.8}.menubtn{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#8090a6;font-size:22px;line-height:1}.menubtn:hover{background:#222c3b;color:var(--text)}
.card h3{font-size:15px;line-height:1.35;margin:14px 0 6px;word-break:break-word}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;padding:4px 7px;border:1px solid #2c394c;background:#18212d;border-radius:999px;color:#9dadc1;font-size:11px}.cardfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:10px;padding-top:18px}.openbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0}.openbtn:hover{text-decoration:underline}.date{font-size:11px;color:#718096;text-align:right}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:54px 20px;text-align:center;color:var(--muted)}.empty svg{width:34px;height:34px;stroke:#66778f;fill:none;stroke-width:1.5;margin-bottom:11px}.empty b{display:block;color:#c5d0df;margin-bottom:5px}
.menu{position:fixed;z-index:50;min-width:155px;background:#171e29;border:1px solid var(--line2);border-radius:11px;padding:6px;box-shadow:var(--shadow);display:none}.menu.open{display:block}.menu button{width:100%;border:0;background:transparent;color:#d8e0eb;text-align:left;padding:9px 10px;border-radius:7px}.menu button:hover{background:#222c3b}.menu button.danger{color:var(--bad)}
.toastbox{position:fixed;right:22px;bottom:22px;z-index:80;display:grid;gap:8px}.toast{background:#18202b;border:1px solid #314057;border-radius:11px;padding:11px 14px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-size:13px;animation:in .18s ease-out}@keyframes in{from{transform:translateY(7px);opacity:0}to{transform:none;opacity:1}}
dialog{border:1px solid var(--line2);border-radius:17px;background:#141a23;color:var(--text);box-shadow:var(--shadow);width:min(520px,calc(100vw - 32px));padding:0}dialog::backdrop{background:rgba(3,6,10,.72);backdrop-filter:blur(3px)}.modal{padding:22px}.modal h3{margin:0 0 18px}.field{margin:13px 0}.field label{display:block;color:#a8b6c8;font-size:12px;margin-bottom:7px}.field input,.field textarea{width:100%;background:#0e141c;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#5377ad}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
#fileInput,#restoreInput{display:none}.mobile-head{display:none}
@media(max-width:820px){.shell{display:block}.sidebar{display:none}.main{padding:22px 16px 40px}.mobile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.topbar{align-items:flex-start}.top-actions .btn span{display:none}.drop{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
@media(max-width:520px){.headline h2{font-size:22px}.headline p{display:none}.toolbar{grid-template-columns:1fr}.search{grid-column:auto}.toolbar select{width:100%}.grid{grid-template-columns:1fr}.topbar{gap:8px}.btn{padding:10px 11px}}

/* VAULT 2.0 — refined daylight workspace */
:root{color-scheme:light;--bg:#f5f6f8;--bg2:#fbfbfc;--panel:#ffffff;--panel2:#f7f8fa;--line:#e4e7ec;--line2:#cad2dc;--text:#202c3c;--muted:#788598;--accent:#224b70;--accent2:#1b3f61;--good:#258367;--warn:#b88638;--bad:#b64855;--shadow:0 18px 48px rgba(32,46,65,.11)}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;letter-spacing:.004em}
.shell{grid-template-columns:256px minmax(0,1fr)}
.sidebar{background:#fff;border-right:1px solid #e7eaf0;padding:30px 18px 23px;gap:34px}
.brand{gap:11px;padding:0 9px}.brandmark{width:42px;height:42px;border-radius:11px;background:#233f57;box-shadow:none}.brandmark svg{fill:none;stroke:#fff;stroke-width:1.7;width:23px;height:23px}
.brand h1{font-size:20px;letter-spacing:.13em;font-weight:850;color:#203951}.brand-dot{color:#b48b52}.brand small{color:#98a2af;font-size:9px;letter-spacing:.12em;margin-top:5px;font-weight:650}
.side-label{color:#8d97a5;font-size:10px;font-weight:750;letter-spacing:.18em;margin-bottom:12px}
.nav{gap:6px}.nav button{border-radius:9px;color:#69778a;padding:12px 13px;font-size:13px;font-weight:600;transition:.16s}
.nav button:hover{background:#f3f6f9;color:#25405b}.nav button.active{background:#eaf0f4;color:#244b69;border-color:#eaf0f4}
.nav svg{stroke-width:1.6}.count{color:#8492a1;font-weight:650;font-variant-numeric:tabular-nums}.folderbtn{font-size:13px;color:#6b798a}.folderbtn:hover,.folderbtn.active{background:#f1f4f7;color:#25415c}
.sidebar-bottom .storage{background:#f8f9fb;border:1px solid #e9edf1;border-radius:10px;padding:15px}.storage .top{color:#748295}.bar{background:#e8edf1}.bar>i{background:#63849a}
.main{padding:47px clamp(24px,4.3vw,70px) 72px;max-width:1740px;margin:auto;width:100%}
.topbar{align-items:center;padding-bottom:22px;border-bottom:1px solid #e5e8ed}.headline h2{font-size:29px;font-weight:780;letter-spacing:-.03em;color:#213348}.headline p{color:#7b8794;font-size:13px;letter-spacing:.015em;margin-top:10px}
.top-actions{gap:9px}.btn{border-radius:8px;background:#fff;color:#56667a;border:1px solid #dfe4e9;padding:11px 14px;font-size:12px;font-weight:700;box-shadow:0 1px 2px #182b3b05;transition:.16s}
.btn:hover{background:#f6f8fa;color:#23415d;border-color:#b8c7d3}.btn.primary{background:#254c6b;color:#fff;border:1px solid #254c6b;font-weight:750;box-shadow:0 3px 8px #16385316}.btn.primary:hover{background:#193d5b;color:#fff}
.toolbar{margin:26px 0 17px;gap:11px}.search input,.toolbar select{background:#fff;border:1px solid #e1e6eb;border-radius:8px;color:#34465b;padding:12px 13px;box-shadow:0 1px 2px #263b5604;font-size:13px}.search input{padding-left:42px}.search svg{stroke:#8292a3}.search input:focus,.toolbar select:focus{border-color:#8ba5bb;box-shadow:0 0 0 3px #386c9b18}.toolbar select{min-width:142px}
.drop{border:1px dashed #bfcdd7;background:#fafdff;border-radius:10px;margin-bottom:34px;padding:20px 23px;box-shadow:inset 0 0 0 1px #ffffff88}.drop.drag{border-color:#507c9b;background:#eaf2f7;transform:none}.drop strong{color:#29445d;font-size:14px;font-weight:750}.drop span{color:#8b98a7;font-size:12px;margin-left:12px}
.section-label{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:17px}.section-label h3{font-size:16px;margin:5px 0 0;color:#26394b;font-weight:800}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:750;color:#91a0ae}.privacy{font-size:11px;color:#8999a6;display:inline-flex;align-items:center;gap:7px}.privacy i{width:6px;height:6px;border-radius:50%;background:#67a492}
.grid{grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}.card{background:#fff;border:1px solid #e4e9ee;box-shadow:0 3px 14px #24364b07;border-radius:11px;min-height:192px;padding:19px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#b7cbd9;box-shadow:0 14px 28px #1e364b11}.card::before{display:none}.card.archived{opacity:.65}
.fileicon{width:43px;height:43px;border-radius:10px;background:#edf2f6;border:1px solid #e2e9ee}.fileicon svg{stroke:#416882}.menubtn{color:#8e9ca8;border-radius:8px}.menubtn:hover{background:#f0f4f6;color:#314b63}.card h3{font-size:14px;line-height:1.5;font-weight:750;color:#2b3c4e;margin:17px 0 8px}.meta{color:#94a0ac;font-size:11px}.badge{background:#f3f6f8;color:#61788b;border:1px solid #e4ebef;border-radius:5px;font-size:10px;padding:4px 7px}.cardfoot{padding-top:23px}.openbtn{color:#245576;font-size:12px;font-weight:800}.date{color:#99a5b1;font-size:10px;line-height:1.7}
.empty{border:1px dashed #cbd5dd;background:#fff;color:#8995a3;border-radius:10px;padding:62px 20px}.empty svg{stroke:#9fb0bb}.empty b{color:#445971}
.menu{background:#fff;border:1px solid #dce4e9;border-radius:10px;box-shadow:var(--shadow)}.menu button{color:#465d72}.menu button:hover{background:#f2f5f8}.toast{background:#fff;border:1px solid #dce5eb;color:#3d5266;box-shadow:0 12px 35px #253b521b}
dialog{background:#fff;color:#24374b;border:1px solid #dfe6ec;box-shadow:var(--shadow)}dialog::backdrop{background:#1a2c3b6b}.modal h3{color:#253b4e}.field label{color:#718296}.field input,.field textarea{background:#fff;color:#24374b;border:1px solid #dce3ea}.field input:focus,.field textarea:focus{border-color:#89a8be}
@media(max-width:820px){.main{padding:26px 19px 50px}.mobile-head{padding:0 0 16px;border-bottom:1px solid #e6eaef}.topbar{gap:14px}.drop span{display:block;margin:6px 0 0}.privacy{display:none}}
@media(max-width:520px){.headline h2{font-size:23px}.top-actions{gap:5px}.btn{padding:10px}.toolbar{gap:9px}.section-label{margin-top:8px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandmark"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM14 2v5h5M9 12h7M9 16h7"/></svg></div>
      <div><h1>VAULT<span class="brand-dot">.</span></h1><small>PRIVATE DOCUMENT LIBRARY</small></div>
    </div>

    <div>
      <div class="nav">
        <button class="active" data-view="all"><span class="left"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h8"/></svg>全部文件</span><span class="count" id="countAll">0</span></button>
        <button data-view="active"><span class="left"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h5"/></svg>使用中</span><span class="count" id="countActive">0</span></button>
        <button data-view="archived"><span class="left"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/></svg>已封存</span><span class="count" id="countArchived">0</span></button>
      </div>
    </div>

    <div>
      <div class="side-label">分類</div>
      <div class="folders" id="folderList"></div>
    </div>

    <div class="sidebar-bottom">
      <div class="storage">
        <div class="top"><span>本機儲存空間</span><span id="storageText">—</span></div>
        <div class="bar"><i id="storageBar"></i></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="mobile-head">
      <div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM14 2v5h5M9 12h7M9 16h7"/></svg></div><div><h1>VAULT<span class="brand-dot">.</span></h1><small>PRIVATE DOCUMENT LIBRARY</small></div></div>
    </div>

    <div class="topbar">
      <div class="headline"><h2 id="viewTitle">全部文件</h2><p>安全整理、搜尋與開啟您的私人加密 HTML 文件。</p></div>
      <div class="top-actions">
        <button class="btn" id="exportBtn" title="備份整個文件庫"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg><span>匯出備份</span></button>
        <button class="btn" id="restoreBtn" title="匯入備份"><svg viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 5h16"/></svg><span>還原</span></button>
        <button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>加入文件</span></button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" placeholder="搜尋檔名、分類、備註…"></div>
      <select id="folderFilter"><option value="">所有分類</option></select>
      <select id="sortSelect"><option value="new">最近加入</option><option value="old">最早加入</option><option value="name">名稱 A–Z</option><option value="size">檔案大小</option></select>
    </div>

    <div class="drop" id="dropZone">
      <div><strong>拖放您的加密文件</strong><span>支援 .html / .htm，資料儲存在此瀏覽器中</span></div>
      <button class="btn" id="dropPick">選擇檔案</button>
    </div>

    <div class="section-label"><div><span class="eyebrow">DOCUMENTS</span><h3>文件總覽</h3></div><span class="privacy"><i></i>僅儲存於本機瀏覽器</span></div>
    <section class="grid" id="grid"></section>
  </main>
</div>

<input id="fileInput" type="file" accept=".html,.htm,text/html" multiple>
<input id="restoreInput" type="file" accept=".json,application/json">
<div class="menu" id="contextMenu"></div>
<div class="toastbox" id="toastBox"></div>

<dialog id="editDialog">
  <form method="dialog" class="modal" id="editForm">
    <h3>文件資訊</h3>
    <div class="field"><label>顯示名稱</label><input id="editName" required></div>
    <div class="field"><label>分類</label><input id="editFolder" placeholder="例如：研究、小說、私人備份"></div>
    <div class="field"><label>備註</label><textarea id="editNote" placeholder="可留空"></textarea></div>
    <div class="modal-actions"><button class="btn" value="cancel">取消</button><button class="btn primary" id="saveEdit" value="default">儲存</button></div>
  </form>
</dialog>

<script>
(() => {
'use strict';
const DB_NAME='vault-deck-db-v1', STORE='docs';
let db=null, docs=[], view='all', selectedFolder='', editingId=null, menuId=null;
const $=id=>document.getElementById(id);

function uid(){return (crypto.randomUUID&&crypto.randomUUID()) || 'd-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtBytes(n=0){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function fmtDate(ts){return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ts))}
function toast(msg){const n=document.createElement('div');n.className='toast';n.textContent=msg;$('toastBox').append(n);setTimeout(()=>n.remove(),2600)}

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function putDoc(doc){return new Promise((res,rej)=>{const r=tx('readwrite').put(doc);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function deleteDoc(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function getDoc(id){return new Promise((res,rej)=>{const r=tx().get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function refresh(){docs=await getAll();render();updateStorage()}
function counts(){$('countAll').textContent=docs.length;$('countActive').textContent=docs.filter(d=>!d.archived).length;$('countArchived').textContent=docs.filter(d=>d.archived).length}
function folderNames(){return [...new Set(docs.map(d=>(d.folder||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function renderFolders(){const names=folderNames();$('folderList').innerHTML=names.length?names.map(f=>`<button class="folderbtn ${selectedFolder===f?'active':''}" data-folder="${esc(f)}">${esc(f)}</button>`).join(''):'<div style="padding:8px 12px;color:#5f6e82;font-size:12px">尚無分類</div>';
 const ff=$('folderFilter'), current=ff.value;ff.innerHTML='<option value="">所有分類</option>'+names.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');ff.value=names.includes(current)?current:'';
 document.querySelectorAll('.folderbtn').forEach(b=>b.onclick=()=>{selectedFolder=b.dataset.folder;$('folderFilter').value=selectedFolder;render()})}
function filtered(){let a=[...docs];if(view==='active')a=a.filter(d=>!d.archived);if(view==='archived')a=a.filter(d=>d.archived);const f=$('folderFilter').value||selectedFolder;if(f)a=a.filter(d=>(d.folder||'')===f);const q=$('searchInput').value.trim().toLowerCase();if(q)a=a.filter(d=>[d.name,d.folder,d.note,d.originalName].some(x=>(x||'').toLowerCase().includes(q)));const s=$('sortSelect').value;if(s==='old')a.sort((x,y)=>x.addedAt-y.addedAt);else if(s==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'zh-Hant'));else if(s==='size')a.sort((x,y)=>y.size-x.size);else a.sort((x,y)=>y.addedAt-x.addedAt);return a}
function render(){counts();renderFolders();const list=filtered(),g=$('grid');const titles={all:'全部文件',active:'使用中',archived:'已封存'};$('viewTitle').textContent=selectedFolder||titles[view];if(!list.length){g.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5"/></svg><b>這裡目前沒有文件</b><span>把加密 HTML 拖進上方區域即可加入。</span></div>`;return}
 g.innerHTML=list.map(d=>`<article class="card ${d.archived?'archived':''}" data-id="${d.id}">
   <div class="cardhead"><div class="fileicon"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM14 2v5h5M9 13h6M9 17h4"/></svg></div><button class="menubtn" data-menu="${d.id}" title="更多">⋯</button></div>
   <h3>${esc(d.name)}</h3><div class="meta"><span>${fmtBytes(d.size)}</span>${d.folder?`<span class="badge">${esc(d.folder)}</span>`:''}${d.archived?'<span class="badge">已封存</span>':''}</div>
   <div class="cardfoot"><button class="openbtn" data-open="${d.id}">開啟文件</button><div class="date">加入於<br>${fmtDate(d.addedAt)}</div></div>
 </article>`).join('');
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();openFile(b.dataset.open)});document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();showMenu(b.dataset.menu,b)});document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(!e.target.closest('button'))openFile(c.dataset.id)})}

async function importFiles(fileList){const files=[...fileList].filter(f=>/\.html?$/i.test(f.name)||f.type==='text/html');if(!files.length){toast('請選擇 HTML 檔案');return}let ok=0;for(const f of files){try{const content=await f.text();if(!/<html[\s>]/i.test(content)&&!/<\!doctype html/i.test(content))continue;await putDoc({id:uid(),name:f.name.replace(/\.html?$/i,''),originalName:f.name,folder:'',note:'',content,size:new Blob([content]).size,addedAt:Date.now(),archived:false});ok++}catch(e){console.error(e)}}await refresh();toast(`已加入 ${ok} 份文件`)}

async function openFile(id){
  // Open synchronously to preserve the Chrome user gesture, and keep the inherited
  // file:// secure context. A blob: navigation can make Web Crypto unavailable.
  const win=window.open('about:blank','_blank');
  if(!win){toast('新分頁被阻擋；請允許彈出式視窗，或從「更多」下載原檔');return}
  try{
    const d=await getDoc(id);
    if(!d)throw new Error('找不到文件');
    // Write into the inherited about:blank document instead of navigating to blob:.
    // Chrome then keeps crypto.subtle available when this library is opened via file://.
    win.document.open('text/html','replace');
    win.document.write(d.content);
    win.document.close();
    // Do not automatically decrypt or store a password; the document owns its UI.
    try {
      if(!win.crypto || !win.crypto.subtle){
        const note=win.document.createElement('aside');
        note.style.cssText='position:fixed;z-index:2147483647;bottom:14px;right:14px;max-width:390px;background:#fff5e6;color:#704411;border:1px solid #ebc78e;padding:14px 16px;border-radius:10px;box-shadow:0 6px 22px #0002;font:14px system-ui';
        note.textContent='此分頁無法使用 Web Crypto。請返回文件庫，從文件選單下載 HTML 原檔，再以 Chrome 直接開啟。';
        win.document.body.appendChild(note);
      }
    } catch(_){}
  }catch(e){try{win.close()}catch(_){}toast('無法開啟文件；請改用「下載原檔」並在 Chrome 中直接開啟')}
}
function downloadDoc(id){getDoc(id).then(d=>{if(!d)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.content],{type:'text/html;charset=utf-8'}));a.download=(d.name||'encrypted-document')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}

function showMenu(id,anchor){menuId=id;const d=docs.find(x=>x.id===id);const m=$('contextMenu');m.innerHTML=`<button data-act="edit">編輯資訊</button><button data-act="download">下載原檔</button><button data-act="archive">${d.archived?'移出封存':'封存文件'}</button><button class="danger" data-act="delete">刪除</button>`;const r=anchor.getBoundingClientRect();m.style.left=Math.min(r.left,window.innerWidth-170)+'px';m.style.top=Math.min(r.bottom+6,window.innerHeight-180)+'px';m.classList.add('open');m.querySelectorAll('button').forEach(b=>b.onclick=()=>menuAction(b.dataset.act))}
async function menuAction(act){const id=menuId, d=docs.find(x=>x.id===id);$('contextMenu').classList.remove('open');if(!d)return;if(act==='download')return downloadDoc(id);if(act==='edit'){editingId=id;$('editName').value=d.name;$('editFolder').value=d.folder||'';$('editNote').value=d.note||'';$('editDialog').showModal();return}if(act==='archive'){d.archived=!d.archived;await putDoc(d);await refresh();toast(d.archived?'已封存':'已移出封存');return}if(act==='delete'){if(confirm(`確定要從文件庫刪除「${d.name}」？\n這不會刪除你電腦上原本的檔案。`)){await deleteDoc(id);await refresh();toast('已從文件庫刪除')}}}

$('saveEdit').onclick=async e=>{e.preventDefault();const d=docs.find(x=>x.id===editingId);if(!d)return;const name=$('editName').value.trim();if(!name)return;d.name=name;d.folder=$('editFolder').value.trim();d.note=$('editNote').value.trim();await putDoc(d);$('editDialog').close();await refresh();toast('文件資訊已更新')};

async function exportDeck(){if(!docs.length){toast('目前沒有文件可備份');return}const payload={type:'vault-deck-backup',version:1,exportedAt:new Date().toISOString(),docs};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));const stamp=new Date().toISOString().slice(0,10);a.download=`vault-deck-backup-${stamp}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('文件庫備份已匯出')}
async function restoreDeck(file){try{const data=JSON.parse(await file.text());if(data.type!=='vault-deck-backup'||!Array.isArray(data.docs))throw new Error('bad');let n=0;for(const d of data.docs){if(!d.content||!d.id)continue;const existing=await getDoc(d.id);await putDoc(existing?{...d,id:uid(),addedAt:Date.now()}:d);n++}await refresh();toast(`已還原 ${n} 份文件`)}catch(e){toast('這不是有效的 Vault Deck 備份檔')}}
async function updateStorage(){if(!navigator.storage?.estimate)return;try{const {usage=0,quota=0}=await navigator.storage.estimate();const p=quota?Math.min(100,usage/quota*100):0;$('storageText').textContent=fmtBytes(usage);$('storageBar').style.width=p+'%'}catch{}}

$('addBtn').onclick=()=>$('fileInput').click();$('dropPick').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{importFiles(e.target.files);e.target.value=''};$('exportBtn').onclick=exportDeck;$('restoreBtn').onclick=()=>$('restoreInput').click();$('restoreInput').onchange=e=>{if(e.target.files[0])restoreDeck(e.target.files[0]);e.target.value=''};
$('searchInput').oninput=render;$('folderFilter').onchange=e=>{selectedFolder=e.target.value;render()};$('sortSelect').onchange=render;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;selectedFolder='';$('folderFilter').value='';render()});
const dz=$('dropZone');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>importFiles(e.dataTransfer.files));
document.addEventListener('click',e=>{if(!e.target.closest('#contextMenu')&&!e.target.closest('[data-menu]'))$('contextMenu').classList.remove('open')});window.addEventListener('resize',()=>$('contextMenu').classList.remove('open'));

(async()=>{try{await openDB();await refresh()}catch(e){console.error(e);$('grid').innerHTML='<div class="empty"><b>瀏覽器無法啟用本機資料庫</b><span>請改用最新版 Chrome、Edge、Firefox 或 Safari。</span></div>'}})();
})();
</script>
</body>
